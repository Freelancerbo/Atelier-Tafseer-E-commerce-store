<!DOCTYPE html>
<html lang="en">
<head>

<title>Atelier Tafseer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#fff;--tx:#1c1917;--mut:#78716c;--pri:#1c1917;--onpri:#faf7f2;--bd:#e7e0d6;--red:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110f;--card:#1c1917;--tx:#f5f0e8;--mut:#a8a29e;--pri:#f5f0e8;--onpri:#13110f;--bd:#2f2a26;--red:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#13110f;--card:#1c1917;--tx:#f5f0e8;--mut:#a8a29e;--pri:#f5f0e8;--onpri:#13110f;--bd:#2f2a26;--red:#f87171;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
a{color:inherit}
.bar{background:var(--pri);color:var(--onpri);text-align:center;font-size:13px;padding:7px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.hd{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.logo{font-size:22px;letter-spacing:.12em;cursor:pointer;text-transform:uppercase}
nav{display:flex;gap:16px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mut)}nav a.on{color:var(--tx);border-bottom:1px solid var(--tx)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{display:inline-block;padding:12px 22px;border:1px solid var(--pri);background:var(--pri);color:var(--onpri);font:inherit;font-size:14px;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;text-decoration:none;text-align:center}
.btn.g{background:transparent;color:var(--tx);border-color:var(--bd)}.btn.r{background:transparent;color:var(--red);border-color:var(--bd)}.btn.w{width:100%}.btn.s{padding:7px 12px;font-size:12px}
.hero{padding:60px 0 36px;text-align:center}.hero h1{font-size:clamp(34px,7vw,60px);line-height:1.1}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.im{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font:italic 60px Georgia,serif;overflow:hidden;background-size:cover}
.im img{width:100%;height:100%;object-fit:cover}
.pc{cursor:pointer}.pc h3{font-size:17px;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 40px}
.tile{height:200px;display:flex;align-items:flex-end;padding:16px;color:#fff;font:26px Georgia,serif;cursor:pointer}
input,select,textarea{width:100%;padding:11px;margin:4px 0;border:1px solid var(--bd);border-radius:2px;background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.chip{padding:6px 14px;border:1px solid var(--bd);border-radius:99px;font-size:14px;cursor:pointer}.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.opt{padding:7px 14px;border:1px solid var(--bd);cursor:pointer;font-size:14px}.opt.on{outline:2px solid var(--tx);outline-offset:-2px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:30px 0}
.th{display:flex;gap:8px;margin-top:8px}.th div{width:60px;height:60px;cursor:pointer;border:1px solid var(--bd);overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
@media(max-width:760px){.pd,.co{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}#ov.on{display:block}
#pn{position:absolute;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--bg);overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.ln{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}.ln .im{width:60px;font-size:24px;flex:none;aspect-ratio:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box{border:1px solid var(--bd);background:var(--card);padding:16px;margin-bottom:12px}
.co{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;padding:26px 0}
.row{display:flex;gap:10px}.row>*{flex:1}.sum>div{display:flex;justify-content:space-between;padding:3px 0}
.q button{width:28px;height:28px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.ar{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.ar .im{width:48px;font-size:20px;flex:none;aspect-ratio:1}.ar>div{flex:1}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pv span{position:relative;width:64px;height:64px;border:1px solid var(--bd)}.pv img{width:100%;height:100%;object-fit:cover}.pv b{position:absolute;top:0;right:0;background:var(--red);color:#fff;width:18px;text-align:center;font-size:12px;cursor:pointer}
footer{margin-top:60px;border-top:1px solid var(--bd);padding:26px 0 40px;color:var(--mut);font-size:14px}
.pub{position:sticky;bottom:0;background:var(--pri);color:var(--onpri);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:6}
.pub .btn{background:var(--onpri);color:var(--pri);border-color:var(--onpri)}
.bar{background:linear-gradient(90deg,#7c3aed,#0d9488,#e11d48,#7c3aed);background-size:300% 100%;animation:slide 10s linear infinite;color:#fff}
header{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 75%,transparent)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 12% 8%,rgba(139,92,246,.2),transparent),radial-gradient(520px 420px at 88% 18%,rgba(20,184,166,.18),transparent),radial-gradient(640px 500px at 50% 98%,rgba(244,63,94,.13),transparent);animation:orb 16s ease-in-out infinite alternate}
.logo,.hero h1{background:linear-gradient(90deg,var(--tx),#8b5cf6,#14b8a6,#f43f5e,var(--tx));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 9s linear infinite}
.hero{position:relative}.hero>*:not(.gems){position:relative}
.gems{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gems i{position:absolute;clip-path:polygon(50% 0,100% 36%,80% 100%,20% 100%,0 36%);animation:flt 7s ease-in-out infinite;opacity:.9}
.gems i::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;animation:slide 3s linear infinite}
.g1{left:6%;top:14%;width:62px;height:70px;background:linear-gradient(135deg,#c4b5fd,#7c3aed)}
.g2{right:8%;top:10%;width:88px;height:98px;background:linear-gradient(135deg,#99f6e4,#0d9488);animation-delay:-2s!important}
.g3{left:16%;bottom:8%;width:46px;height:52px;background:linear-gradient(135deg,#fecdd3,#e11d48);animation-delay:-4s!important}
.g4{right:18%;bottom:12%;width:56px;height:62px;background:linear-gradient(135deg,#fde68a,#d97706);animation-delay:-1s!important}
.g5{left:44%;top:2%;width:34px;height:38px;background:linear-gradient(135deg,#bae6fd,#0284c7);animation-delay:-3s!important}
.gm{display:inline-block;width:22px;height:25px;clip-path:polygon(50% 0,100% 36%,80% 100%,20% 100%,0 36%);background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.25));animation:flt 5s ease-in-out infinite}
.btn:not(.g):not(.r){position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.btn:not(.g):not(.r):hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.45)}
.btn:not(.g):not(.r)::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
.pc,.tile{transition:transform .35s,box-shadow .35s}.pc:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(139,92,246,.28)}.tile:hover{transform:scale(1.02)}
#app>.wrap,.grid>*{animation:up .6s both}.grid>*:nth-child(2){animation-delay:.07s}.grid>*:nth-child(3){animation-delay:.14s}.grid>*:nth-child(4){animation-delay:.21s}.grid>*:nth-child(n+5){animation-delay:.28s}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 22px}
.st,.cc{position:relative;overflow:hidden;padding:16px;border-radius:14px;color:#fff;text-decoration:none;display:block;animation:up .6s both;transition:transform .25s,box-shadow .25s}
.st:hover,.cc:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.st b,.cc b{display:block;font:30px Georgia,serif;word-break:break-word}.cc b{font-size:17px}
.st .gm,.cc .gm{position:absolute;right:12px;top:12px;width:30px;height:34px}
.cc{background:linear-gradient(135deg,var(--c),rgba(0,0,0,.55))}.cc .mut{color:rgba(255,255,255,.8)}.st span{opacity:.9}
.br{height:10px;border-radius:6px;background:linear-gradient(90deg,#8b5cf6,#14b8a6);width:0;animation:grow 1.1s .2s forwards}
.tag{font:clamp(20px,4.5vw,32px)/1.3 Georgia,serif;min-height:1.4em;margin:8px 0 16px;background:linear-gradient(90deg,#8b5cf6,#14b8a6,#f43f5e,#f59e0b,#8b5cf6);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 6s linear infinite}
.tw::after{content:'|';margin-left:3px;animation:blink 1s steps(2) infinite}
.st::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4s infinite}
.av{width:100%;height:100%}.av svg{width:100%;height:100%;display:block}
.sg{position:relative}.sg>*{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease,transform 5s ease}.sg>.on{opacity:1;transform:scale(1.07)}
@keyframes blink{50%{opacity:0}}
@keyframes slide{to{background-position:150% 0}}@keyframes shine{to{left:130%}}@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes flt{50%{transform:translateY(-16px) rotate(6deg)}}@keyframes orb{to{transform:scale(1.15) translate(20px,-10px)}}@keyframes grow{to{width:var(--w)}}

</style>

<script>
var DATA=JSON.parse(document.getElementById('data').textContent),ST=DATA.store,CUR='USD',RT={USD:1,EUR:.92,GBP:.79,AED:3.67},SY={USD:'$',EUR:'€',GBP:'£',AED:'AED '};
var cart=[],cat='All',sel={},gi=0,isOwner=false,dirty=false,last=null,ed=null,eimg=[],AT='p',DK='tafseer_draft';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function F(u){var v=u*RT[CUR];return SY[CUR]+v.toLocaleString('en-US',{minimumFractionDigits:CUR==='AED'?0:2,maximumFractionDigits:CUR==='AED'?0:2})}
function PR(id){return DATA.products.filter(function(p){return p.id===id})[0]}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function im0(p,k){var u=p.img&&p.img[k||0];return u?'<div class="im"><img alt="'+esc(p.n)+'" src="'+esc(u)+'"></div>':'<div class="im" style="background:linear-gradient(145deg,hsl('+hue(p.id+p.n)+' 38% 30%),hsl('+(hue(p.id+p.n)+40)+' 45% 55%))">'+esc(p.n.charAt(0))+'</div>'}
function sub(){return cart.reduce(function(a,l){return a+PR(l.id).p*l.q},0)}
function shipc(c){return sub()>=ST.freeOver?0:(ST.zones[c]||25)}
function route(){return (location.hash||'#/').slice(1)||'/'}
function nav(r){location.hash='#'+r;window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){closeP();gi=0;cat='All';draw()});
function draw(){
  var r=route();
  document.title=ST.name;$('logo').textContent=ST.name;
  $('bar').textContent='Free worldwide shipping on orders over '+F(ST.freeOver)+' · Handcrafted in Pakistan';
  var L=[['/','Home'],['/women','Women'],['/men','Men'],['/shop','Shop all'],['/about','About'],['/help','Help'],['/contact','Contact']];
  if(isOwner)L.push(['/admin','⚙ Admin']);
  $('nv').innerHTML=L.map(function(l){return '<a href="#'+l[0]+'" class="'+(r===l[0]?'on':'')+'">'+l[1]+'</a>'}).join('');
  $('cc').textContent=cart.reduce(function(a,l){return a+l.q},0);
  var h;
  if(r==='/')h=home();else if(r==='/shop'||r==='/men'||r==='/women')h=shop(r);else if(r.indexOf('/p/')===0)h=prod(r.slice(3));
  else if(r==='/about')h=page('About us','<p>'+esc(ST.about)+'</p>');else if(r==='/help')h=helpPg();else if(r==='/contact')h=contactPg();
  else if(r==='/checkout')h=checkout();else if(r==='/done')h=done();else if(r==='/admin'&&isOwner)h=admin();else h=home();
  $('app').innerHTML=h+'<footer><div class="wrap">© '+esc(ST.name)+' · '+esc(ST.owner||'')+' · '+esc(ST.email)+' · '+esc(ST.phone||'')+'</div></footer>'+(isOwner&&dirty?'<div class="pub"><span>You have unpublished changes. Customers cannot see them yet.</span><button class="btn s" onclick="publish()">Publish store</button></div>':'');
  if(r==='/checkout')upd();count();typer();
}
function card(p){return '<div class="pc" onclick="nav(\'/p/'+p.id+'\')">'+im(p)+'<h3>'+esc(p.n)+'</h3><div class="mut">'+esc(p.g)+' · '+F(p.p)+'</div></div>'}
function home(){
  var f=DATA.products.filter(function(p){return p.f});if(!f.length)f=DATA.products.slice(0,4);
  return '<div class="wrap"><section class="hero"><div class=gems><i class=g1></i><i class=g2></i><i class=g3></i><i class=g4></i><i class=g5></i></div><div class="mut" style="letter-spacing:.2em">HANDCRAFTED IN PAKISTAN</div><h1 style="margin:10px 0">Made slowly, by hand,<br>to last.</h1><p class="mut" style="max-width:480px;margin:0 auto 20px">Clothing, footwear and accessories from skilled artisans, delivered worldwide.</p><div class="tag"><span class="tw" data-t="We not only sell items, we give guarantee of your choice"></span></div><a class="btn" href="#/shop">Shop all</a></section><div class="tiles"><div class="tile" style="background:linear-gradient(160deg,#7f1d4d,#d6709f)" onclick="nav(\'/women\')">Women →</div><div class="tile" style="background:linear-gradient(160deg,#1e3a5f,#6b9bd1)" onclick="nav(\'/men\')">Men →</div></div><h2 style="font-size:26px;margin-bottom:14px">Featured</h2><div class="grid">'+f.map(card).join('')+'</div></div>';
}
function shop(r){
  var g=r==='/men'?'Men':r==='/women'?'Women':'';
  var base=DATA.products.filter(function(p){return !g||p.g===g||p.g==='Unisex'});
  var cats=['All'].concat(base.map(function(p){return p.cat}).filter(function(v,i,a){return a.indexOf(v)===i}));
  var l=base.filter(function(p){return cat==='All'||p.cat===cat});
  return '<div class="wrap" style="padding-top:26px"><h2 style="font-size:30px">'+(g||'All products')+'</h2><div class="chips">'+cats.map(function(c){return '<span class="chip'+(c===cat?' on':'')+'" onclick="cat=\''+esc(c).replace(/'/g,'')+'\';draw()">'+esc(c)+'</span>'}).join('')+'</div>'+(l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<p class="mut">No products here yet.</p>')+'</div>';
}
function prod(id){
  var p=PR(id);if(!p)return page('Not found','<p>This product does not exist.</p>');
  if(sel.id!==id)sel={id:id,s:p.sz[0],c:p.co[0]};
  var imgs=p.img&&p.img.length?p.img:[null];
  var big=p.img&&p.img.length?im(p,gi):im(p);
  return '<div class="wrap"><div class="pd"><div>'+big+(imgs.length>1?'<div class="th">'+imgs.map(function(u,i){return '<div onclick="gi='+i+';draw()"><img alt="" src="'+esc(u)+'"></div>'}).join('')+'</div>':'')+'</div><div><div class="mut">'+esc(p.g)+' · '+esc(p.cat)+'</div><h1 style="font-size:32px;margin:4px 0">'+esc(p.n)+'</h1><div style="font-size:22px;margin-bottom:10px">'+F(p.p)+'</div><p class="mut">'+esc(p.d)+'</p>'+
  (p.sz.length?'<div class="mut">Size</div><div class="opts">'+p.sz.map(function(s,i){return '<span class="opt'+(s===sel.s?' on':'')+'" onclick="sel.s=PR(sel.id).sz['+i+'];draw()">'+esc(s)+'</span>'}).join('')+'</div>':'')+
  (p.co.length?'<div class="mut">Colour</div><div class="opts">'+p.co.map(function(c,i){return '<span class="opt'+(c===sel.c?' on':'')+'" onclick="sel.c=PR(sel.id).co['+i+'];draw()">'+esc(c)+'</span>'}).join('')+'</div>':'')+
  '<button class="btn w" onclick="addCart()">Add to bag</button><p class="mut" style="margin-top:12px">✓ Ships in 2–3 days &nbsp; ✓ 30-day returns</p></div></div></div>';
}
function addCart(){var s=sel,l=cart.filter(function(x){return x.id===s.id&&x.s===s.s&&x.c===s.c})[0];if(l)l.q++;else cart.push({id:s.id,s:s.s,c:s.c,q:1});draw();openCart()}
function openCart(){
  $('ov').classList.add('on');
  var h='<div class="top"><h2 style="font-size:24px">Your bag</h2><button class="btn g s" onclick="closeP()">Close</button></div>';
  if(!cart.length)h+='<p class="mut">Your bag is empty.</p>';
  cart.forEach(function(l,i){var p=PR(l.id);h+='<div class="ln">'+im(p)+'<div style="flex:1"><b>'+esc(p.n)+'</b><div class="mut">'+esc(l.s)+' · '+esc(l.c)+' · '+F(p.p)+'</div><div class="q" style="margin-top:6px"><button onclick="qty('+i+',-1)">−</button> <span style="padding:0 8px">'+l.q+'</span> <button onclick="qty('+i+',1)">+</button></div></div><b>'+F(p.p*l.q)+'</b></div>'});
  if(cart.length)h+='<div class="ln top"><span>Subtotal</span><b>'+F(sub())+'</b></div><button class="btn w" onclick="closeP();nav(\'/checkout\')">Checkout</button>';
  $('pn').innerHTML=h;
